<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background Gradient -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e29a6b" />
      <stop offset="100%" stop-color="#c67e50" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGlow)" />

  <!-- Outer Tech Circle Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.4" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="#312e81" stroke-width="1.5" />

  <!-- Group containing the character, masked to stay inside the inner circle -->
  <g>
    <!-- Clip Path for circular frame -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="170" />
    </clipPath>
    
    <g clip-path="url(#circleClip)">
      <!-- Background of the clip-circle -->
      <circle cx="200" cy="200" r="170" fill="#090d16" />

      <!-- Back neck and shoulders base shadow -->
      <path d="M160,260 L240,260 L250,300 L150,300 Z" fill="#b06c40" opacity="0.4" />

      <!-- Shirt Collar Background -->
      <path d="M145,260 L255,260 L265,305 L135,305 Z" fill="#7dd3fc" />

      <!-- Neck -->
      <path d="M170,200 L230,200 L230,265 C230,285 170,285 170,265 Z" fill="url(#skinGrad)" />
      <!-- Neck shadow -->
      <path d="M170,215 C190,235 210,235 230,215 L230,240 C230,250 170,250 170,240 Z" fill="#a05e35" opacity="0.6" />

      <!-- Sky Blue Collared Shirt (open top button) -->
      <!-- Left Collar -->
      <path d="M170,260 L145,295 L180,310 L188,270 Z" fill="url(#shirtGrad)" stroke="#60a5fa" stroke-width="1" />
      <!-- Right Collar -->
      <path d="M230,260 L255,295 L220,310 L212,270 Z" fill="url(#shirtGrad)" stroke="#60a5fa" stroke-width="1" />
      <!-- Inner shirt throat opening -->
      <path d="M188,270 L200,295 L212,270 Z" fill="#c67e50" />

      <!-- Suit / Blazer -->
      <path d="M100,310 C120,295 140,290 155,290 L180,350 L140,400 L70,400 C70,360 85,325 100,310 Z" fill="url(#suitGrad)" />
      <path d="M300,310 C280,295 260,290 245,290 L220,350 L260,400 L330,400 C330,360 315,325 300,310 Z" fill="url(#suitGrad)" />
      <!-- Left Lapel -->
      <path d="M155,290 L185,345 L175,370 L140,310 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Right Lapel -->
      <path d="M245,290 L215,345 L225,370 L260,310 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />

      <!-- Head Base -->
      <path d="M140,150 C140,105 165,100 200,100 C235,100 260,105 260,150 C260,205 235,225 200,225 C165,225 140,205 140,150 Z" fill="url(#skinGrad)" />

      <!-- Ears -->
      <circle cx="137" cy="160" r="15" fill="#c67e50" />
      <circle cx="263" cy="160" r="15" fill="#c67e50" />
      <circle cx="137" cy="160" r="10" fill="#a05e35" />
      <circle cx="263" cy="160" r="10" fill="#a05e35" />

      <!-- Beard Stubble & Mustache (Matching user's style) -->
      <!-- Beard under jaw and chin -->
      <path d="M140,165 C140,212 165,230 200,230 C235,230 260,212 260,165 C260,185 245,225 200,225 C155,225 140,185 140,165 Z" fill="#2d221c" opacity="0.85" />
      <path d="M140,180 L145,200 C155,222 175,228 200,228 C225,228 245,222 255,200 L260,180 C258,208 235,226 200,226 C165,226 142,208 140,180 Z" fill="#111111" opacity="0.4" />
      <!-- Mustache -->
      <path d="M170,188 C180,183 190,183 200,185 C210,183 220,183 230,188 C220,192 210,193 200,193 C190,193 180,192 170,188 Z" fill="#1e1613" />
      <path d="M175,189 C185,186 195,186 200,188 C205,186 215,186 225,189 C215,191 205,191 200,191 C195,191 185,191 175,189 Z" fill="#111111" />
      <!-- Small soul patch below lip -->
      <path d="M193,204 L207,204 L200,212 Z" fill="#1e1613" />

      <!-- Eyes (Modern stylized glasses/eyes) -->
      <!-- Left Eye -->
      <ellipse cx="178" cy="155" rx="10" ry="6" fill="#ffffff" />
      <circle cx="178" cy="155" r="5" fill="#451a03" />
      <circle cx="176" cy="153" r="2" fill="#ffffff" />
      <path d="M166,148 C173,144 183,144 190,148" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <!-- Right Eye -->
      <ellipse cx="222" cy="155" rx="10" ry="6" fill="#ffffff" />
      <circle cx="222" cy="155" r="5" fill="#451a03" />
      <circle cx="220" cy="153" r="2" fill="#ffffff" />
      <path d="M210,148 C217,144 227,144 234,148" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" />

      <!-- Nose -->
      <path d="M194,155 L200,178 L206,178" fill="none" stroke="#b06c40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Lips -->
      <path d="M185,198 C192,201 208,201 215,198" fill="none" stroke="#a05e35" stroke-width="2.5" stroke-linecap="round" />

      <!-- Thick, Volume Black Hair (Matching user's magnificent styled volume haircut) -->
      <!-- Back hair base -->
      <path d="M135,140 C130,110 145,80 180,75 C200,72 220,75 235,80 C255,85 270,110 265,140 C272,130 274,110 268,90 C260,70 240,60 200,58 C160,60 140,70 132,90 C126,110 128,130 135,140 Z" fill="#0c0a09" />
      <!-- Top/Front hair volume with curves -->
      <path d="M132,130 C130,110 138,90 155,80 C170,70 190,68 210,72 C230,76 248,82 258,96 C265,106 268,120 268,130 C264,115 255,95 240,88 C225,82 205,80 185,82 C165,84 148,96 140,115 C136,122 134,126 132,130 Z" fill="#1c1917" />
      <!-- Individual sideburns & spikes -->
      <path d="M136,130 L134,150 L142,145 Z" fill="#0c0a09" />
      <path d="M264,130 L266,150 L258,145 Z" fill="#0c0a09" />

      <!-- Extra highlights on hair for magnificent volume depth -->
      <path d="M165,85 C185,78 215,78 235,85" fill="none" stroke="#292524" stroke-width="6" stroke-linecap="round" opacity="0.8" />
      <path d="M150,98 C170,90 205,88 225,95" fill="none" stroke="#292524" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>

  <!-- High-tech Overlay HUD Details -->
  <!-- Floating programming brackets next to avatar -->
  <text x="35" y="100" fill="#6366f1" font-family="monospace" font-size="28" font-weight="bold" opacity="0.3">&lt;</text>
  <text x="345" y="100" fill="#a855f7" font-family="monospace" font-size="28" font-weight="bold" opacity="0.3">&gt;</text>

  <!-- Technical grid ticks around avatar -->
  <line x1="200" y1="10" x2="200" y2="22" stroke="#6366f1" stroke-width="2" opacity="0.5" />
  <line x1="200" y1="378" x2="200" y2="390" stroke="#6366f1" stroke-width="2" opacity="0.5" />
  <line x1="10" y1="200" x2="22" y2="200" stroke="#6366f1" stroke-width="2" opacity="0.5" />
  <line x1="378" y1="200" x2="390" y2="200" stroke="#6366f1" stroke-width="2" opacity="0.5" />
</svg>
